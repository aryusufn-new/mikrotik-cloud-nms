services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nms-backend
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/data/mikrotik_nms.db
      - NMS_SECRET_KEY=${NMS_SECRET_KEY:-mikrotik_cloud_nms_secret_key_2026}
    volumes:
      - nms-data:/app/data
    networks:
      - nms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nms-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - nms-network

volumes:
  nms-data:
    driver: local

networks:
  nms-network:
    driver: bridge
