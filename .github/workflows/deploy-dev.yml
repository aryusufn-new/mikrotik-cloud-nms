name: Deploy NMS to VM

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          command_timeout: 20m
          script: |
            set -e

            APP_DIR="$HOME/mikrotik-cloud-nms"

            # Clone atau pull repo
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/aryusufn-new/mikrotik-cloud-nms.git "$APP_DIR"
              cd "$APP_DIR"
              git checkout dev
            else
              cd "$APP_DIR"
              git fetch origin dev
              git reset --hard origin/dev
            fi

            # Build dan deploy containers
            docker compose build --no-cache
            docker compose up -d --force-recreate
            docker compose ps

            echo "✅ MikroTik Cloud NMS deployed on port 8082"
